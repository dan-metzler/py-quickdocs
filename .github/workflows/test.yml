name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install dev dependencies
        run: uv add --dev pytest pytest-cov

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=main --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: coverage.xml

  badge:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras && uv add --dev pytest

      - name: Count passing tests
        id: count
        run: |
          RESULT=$(uv run pytest tests/ --tb=no -q 2>&1)
          COUNT=$(echo "$RESULT" | grep -oP '\d+(?= passed)' | tail -1)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update badge in README
        run: |
          COUNT="${{ steps.count.outputs.count }}"
          sed -i "s|tests-[0-9]*%20passing-brightgreen|tests-${COUNT}%20passing-brightgreen|" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "[docs] update test badge"
            git push
          fi
